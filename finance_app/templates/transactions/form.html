{% extends "base.html" %}

{% block title %}{{ form_title }} - Finance Tracker{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ form_title }}</h1>
    <a class="btn btn-outline-secondary" href="{{ url_for('transactions_list') }}">Back to Transactions</a>
</div>

<form method="post" class="row g-3">
    <div class="col-md-6">
        <label class="form-label" for="account_id">Account</label>
        <select class="form-select" id="account_id" name="account_id" required>
            <option value="">Select an account</option>
            {% for account in accounts %}
                <option
                    value="{{ account.account_id }}"
                    {% if form_values.account_id|string == account.account_id|string %}selected{% endif %}
                >
                    {{ account.account_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-6">
        <label class="form-label" for="category_id">Category</label>
        <select class="form-select" id="category_id" name="category_id">
            <option value="">No category</option>
            {% for category in categories %}
                <option
                    value="{{ category.category_id }}"
                    {% if form_values.category_id|string == category.category_id|string %}selected{% endif %}
                >
                    {{ category.category_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label" for="amount">Amount</label>
        <input
            class="form-control"
            id="amount"
            name="amount"
            value="{{ form_values.amount }}"
            required
        >
    </div>

    <div class="col-md-4">
        <label class="form-label" for="transaction_type">Transaction Type</label>
        <select class="form-select" id="transaction_type" name="transaction_type" required>
            <option value="debit" {% if form_values.transaction_type == "debit" %}selected{% endif %}>debit</option>
            <option value="credit" {% if form_values.transaction_type == "credit" %}selected{% endif %}>credit</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label" for="merchant">Merchant</label>
        <input
            class="form-control"
            id="merchant"
            name="merchant"
            value="{{ form_values.merchant }}"
        >
    </div>

    <div class="col-md-6">
        <label class="form-label" for="transaction_date">Transaction Date</label>
        <input
            class="form-control"
            id="transaction_date"
            name="transaction_date"
            type="date"
            value="{{ form_values.transaction_date }}"
            required
        >
    </div>

    <div class="col-md-6">
        <label class="form-label" for="posted_date">Posted Date</label>
        <input
            class="form-control"
            id="posted_date"
            name="posted_date"
            type="date"
            value="{{ form_values.posted_date }}"
        >
    </div>

    <div class="col-12">
        <label class="form-label" for="description">Description</label>
        <input
            class="form-control"
            id="description"
            name="description"
            value="{{ form_values.description }}"
        >
    </div>

    <div class="col-12">
        <div class="form-check">
            <input
                class="form-check-input"
                id="is_recurring"
                name="is_recurring"
                type="checkbox"
                {% if form_values.is_recurring %}checked{% endif %}
            >
            <label class="form-check-label" for="is_recurring">Recurring transaction</label>
        </div>
    </div>

    <div class="col-12">
        <button class="btn btn-primary" type="submit">Save Transaction</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('transactions_list') }}">Cancel</a>
    </div>
</form>
{% endblock %}
